<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>이미지 색상 추출기</title>
<meta name="description" content="이미지를 클릭해 HEX·RGB·HSL 색상 코드를 확인하고 복사">
<meta name="tags" content="이미지">
<meta name="date" content="2026-10-30">
<style>
  /* 레이아웃: 왼쪽 이미지 캔버스 + 오른쪽 320px 색상 정보 패널, 좁은 화면에서는 한 줄로 쌓임 */
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --fg: #1c1e24;
    --muted: #666b78;
    --line: #dfe2e8;
    --accent: #1f6feb;
    --accent-fg: #ffffff;
    --canvas-bg: #e9ebf0;
    --font-ui: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
    --font-code: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101216; --surface: #1a1d23; --fg: #eceef2; --muted: #9096a3;
      --line: #2c3039; --accent: #5b9dff; --accent-fg: #0b1220; --canvas-bg: #14171c;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101216; --surface: #1a1d23; --fg: #eceef2; --muted: #9096a3;
    --line: #2c3039; --accent: #5b9dff; --accent-fg: #0b1220; --canvas-bg: #14171c;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14px;
    padding-block: 24px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .wrap { max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; text-wrap: balance; }
  .desc { margin: 0 0 18px; color: var(--muted); line-height: 1.55; max-width: 65ch; }

  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: start; }
  @media (max-width: 820px) { .layout { grid-template-columns: minmax(0, 1fr); } }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }

  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .hint { color: var(--muted); font-size: 12px; flex: 1 1 200px; min-width: 0; }
  .btn {
    appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--fg);
    padding: 8px 12px; border-radius: 8px; font: inherit; font-size: 13px; cursor: pointer;
  }
  .btn:hover { border-color: var(--accent); }
  .btn:focus-visible, .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600; }

  .stage { background: var(--canvas-bg); border-radius: 8px; padding: 8px; overflow: auto; max-height: 72vh; text-align: center; }
  .stage.over { outline: 2px dashed var(--accent); outline-offset: -4px; }
  canvas#cv { max-width: 100%; height: auto; cursor: crosshair; border-radius: 4px; display: inline-block; vertical-align: top; }

  .preview { height: 96px; border-radius: 8px; border: 1px solid var(--line); margin-bottom: 8px; background: #7c8ea6; }
  .row { display: flex; align-items: center; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .row:last-of-type { border-bottom: 0; }
  .row b { width: 36px; color: var(--muted); font-weight: 600; font-size: 12px; letter-spacing: .04em; }
  .row code { flex: 1; min-width: 0; font-family: var(--font-code); font-size: 14px; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }

  h2 { font-size: 12px; margin: 16px 0 8px; color: var(--muted); font-weight: 600; letter-spacing: .04em; }
  .history { display: grid; grid-template-columns: repeat(auto-fill, minmax(68px, 1fr)); gap: 8px; }
  .history:empty::before { content: "이미지를 클릭하면 여기에 쌓여요"; color: var(--muted); font-size: 12px; grid-column: 1 / -1; }
  .chip { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; cursor: pointer; background: var(--surface); color: var(--fg); padding: 0; font: 10px var(--font-code); text-align: center; }
  .chip i { display: block; height: 32px; }
  .chip span { display: block; padding: 3px 0; }

  #loupe { position: fixed; pointer-events: none; width: 120px; height: 120px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.45), 0 4px 14px rgba(0,0,0,.35); z-index: 20; overflow: hidden; background: #000; }
  #loupe canvas { width: 100%; height: 100%; display: block; }
  #loupe::after { content: ""; position: absolute; left: 50%; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border: 1.5px solid #000; outline: 1.5px solid #fff; }
  #loupeTag { position: fixed; pointer-events: none; z-index: 21; background: rgba(0,0,0,.82); color: #fff; font: 12px var(--font-code); padding: 3px 8px; border-radius: 6px; }

  #toast {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    background: #23262d; color: #fff; padding: 8px 14px; border-radius: 8px; font-size: 13px;
    opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 30; max-width: calc(100vw - 32px);
  }
  #toast.show { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
</style>
</head>
<body>

<div class="wrap">
  <h1>이미지 색상 추출기</h1>
  <p class="desc">이미지를 불러온 뒤 원하는 위치를 클릭하거나 탭하면 색상 코드(HEX, RGB, HSL)를 확인하고 복사할 수 있어요. 이미지는 이 브라우저 안에서만 처리돼요.</p>

  <div class="layout">
    <section class="panel">
      <div class="toolbar">
        <button class="btn primary" id="openBtn" type="button">이미지 선택</button>
        <button class="btn" id="screenBtn" type="button" hidden>화면 스포이드</button>
        <input type="file" id="file" accept="image/*" hidden>
        <span class="hint" id="hint">샘플 이미지예요. 내 이미지는 선택, 끌어다 놓기, 붙여넣기(Ctrl+V)로 불러오세요.</span>
      </div>
      <div class="stage" id="stage"><canvas id="cv" width="800" height="500"></canvas></div>
    </section>

    <aside class="panel">
      <div class="preview" id="preview"></div>
      <div class="row"><b>HEX</b><code id="hex">-</code><button class="btn" type="button" data-copy="hex">복사</button></div>
      <div class="row"><b>RGB</b><code id="rgb">-</code><button class="btn" type="button" data-copy="rgb">복사</button></div>
      <div class="row"><b>HSL</b><code id="hsl">-</code><button class="btn" type="button" data-copy="hsl">복사</button></div>
      <h2>선택 기록</h2>
      <div class="history" id="history"></div>
    </aside>
  </div>
</div>

<div id="loupe" hidden><canvas id="lp" width="120" height="120"></canvas></div>
<div id="loupeTag" hidden></div>
<div id="toast" role="status"></div>

<script>
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d', { willReadFrequently: true });
const lp = $('lp'), lctx = lp.getContext('2d');
lctx.imageSmoothingEnabled = false;
const loupe = $('loupe'), loupeTag = $('loupeTag');
const cur = { hex: '', rgb: '', hsl: '' };
const history = [];

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 1600);
}

function rgbToHsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  let h = 0, s = 0; const l = (max + min) / 2;
  if (max !== min) {
    const d = max - min;
    s = l > .5 ? d / (2 - max - min) : d / (max + min);
    if (max === r) h = (g - b) / d + (g < b ? 6 : 0);
    else if (max === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h *= 60;
  }
  return `hsl(${Math.round(h)}, ${Math.round(s * 100)}%, ${Math.round(l * 100)}%)`;
}
const toHex = (r, g, b) => '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('').toUpperCase();

function setColor(r, g, b, record) {
  cur.hex = toHex(r, g, b);
  cur.rgb = `rgb(${r}, ${g}, ${b})`;
  cur.hsl = rgbToHsl(r, g, b);
  $('hex').textContent = cur.hex;
  $('rgb').textContent = cur.rgb;
  $('hsl').textContent = cur.hsl;
  $('preview').style.background = cur.hex;
  if (record && history[0] !== cur.hex) {
    history.unshift(cur.hex);
    if (history.length > 24) history.pop();
    renderHistory();
  }
}

function renderHistory() {
  const h = $('history'); h.innerHTML = '';
  history.forEach(hex => {
    const d = document.createElement('button');
    d.type = 'button';
    d.className = 'chip';
    d.innerHTML = '<i style="background:' + hex + '"></i><span>' + hex + '</span>';
    d.onclick = () => {
      const n = parseInt(hex.slice(1), 16);
      setColor(n >> 16, (n >> 8) & 255, n & 255, false);
    };
    h.appendChild(d);
  });
}

/* 샘플 이미지: 색상환 그라데이션 + 명도 오버레이 + 기본 색상 띠 */
function drawSample() {
  const W = 800, H = 500;
  cv.width = W; cv.height = H;
  const g1 = ctx.createLinearGradient(0, 0, W, 0);
  for (let i = 0; i <= 12; i++) g1.addColorStop(i / 12, 'hsl(' + (i * 30) + ', 85%, 52%)');
  ctx.fillStyle = g1; ctx.fillRect(0, 0, W, 400);
  const g2 = ctx.createLinearGradient(0, 0, 0, 400);
  g2.addColorStop(0, 'rgba(255,255,255,.85)');
  g2.addColorStop(.5, 'rgba(255,255,255,0)');
  g2.addColorStop(1, 'rgba(0,0,0,.8)');
  ctx.fillStyle = g2; ctx.fillRect(0, 0, W, 400);
  const sw = ['#1F2937', '#6B7280', '#E5E7EB', '#EF4444', '#F59E0B', '#10B981', '#3B82F6', '#8B5CF6'];
  sw.forEach((c, i) => { ctx.fillStyle = c; ctx.fillRect(i * (W / sw.length), 400, W / sw.length, 100); });
}

function loadFile(f) {
  if (!f || !f.type || !f.type.startsWith('image/')) { toast('이미지 파일만 불러올 수 있어요'); return; }
  const url = URL.createObjectURL(f);
  const img = new Image();
  img.onload = () => {
    cv.width = img.naturalWidth; cv.height = img.naturalHeight;
    ctx.drawImage(img, 0, 0);
    URL.revokeObjectURL(url);
    $('hint').textContent = f.name + ' (' + img.naturalWidth + '×' + img.naturalHeight + ')';
    $('stage').scrollTo(0, 0);
  };
  img.onerror = () => toast('이미지를 열 수 없어요. 다른 파일을 선택해 보세요');
  img.src = url;
}

$('openBtn').onclick = () => $('file').click();
$('file').onchange = e => { loadFile(e.target.files[0]); e.target.value = ''; };
document.addEventListener('dragover', e => { e.preventDefault(); $('stage').classList.add('over'); });
document.addEventListener('dragleave', e => { if (!e.relatedTarget) $('stage').classList.remove('over'); });
document.addEventListener('drop', e => {
  e.preventDefault(); $('stage').classList.remove('over');
  loadFile(e.dataTransfer.files[0]);
});
document.addEventListener('paste', e => {
  const items = e.clipboardData ? [...e.clipboardData.items] : [];
  const item = items.find(i => i.type.startsWith('image/'));
  if (item) loadFile(item.getAsFile());
});

function pixelAt(e) {
  const r = cv.getBoundingClientRect();
  const x = Math.floor((e.clientX - r.left) * cv.width / r.width);
  const y = Math.floor((e.clientY - r.top) * cv.height / r.height);
  if (x < 0 || y < 0 || x >= cv.width || y >= cv.height) return null;
  const d = ctx.getImageData(x, y, 1, 1).data;
  return { x, y, R: d[0], G: d[1], B: d[2] };
}

function showLoupe(e, p) {
  const s = 15;
  lctx.clearRect(0, 0, 120, 120);
  lctx.drawImage(cv, p.x - (s >> 1), p.y - (s >> 1), s, s, 0, 0, 120, 120);
  const touch = e.pointerType === 'touch';
  const left = Math.min(e.clientX + 20, window.innerWidth - 130);
  const top = touch ? Math.max(e.clientY - 160, 8) : Math.min(e.clientY + 20, window.innerHeight - 160);
  loupe.hidden = false; loupeTag.hidden = false;
  loupe.style.left = left + 'px'; loupe.style.top = top + 'px';
  loupeTag.style.left = left + 'px'; loupeTag.style.top = (top + 126) + 'px';
  loupeTag.textContent = toHex(p.R, p.G, p.B);
}
function hideLoupe() { loupe.hidden = true; loupeTag.hidden = true; }

cv.addEventListener('pointermove', e => {
  const p = pixelAt(e); if (!p) return;
  showLoupe(e, p);
  setColor(p.R, p.G, p.B, false);
});
cv.addEventListener('pointerleave', hideLoupe);
cv.addEventListener('pointerup', e => { if (e.pointerType === 'touch') hideLoupe(); });
cv.addEventListener('click', e => {
  const p = pixelAt(e); if (!p) return;
  setColor(p.R, p.G, p.B, true);
  toast(toHex(p.R, p.G, p.B) + ' 선택됨');
});

function selectText(el) {
  const r = document.createRange(); r.selectNodeContents(el);
  const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
}
document.querySelectorAll('[data-copy]').forEach(b => b.onclick = async () => {
  const key = b.dataset.copy, v = cur[key];
  if (!v) { toast('먼저 이미지에서 색상을 선택하세요'); return; }
  try { await navigator.clipboard.writeText(v); toast('복사됨: ' + v); }
  catch (err) { selectText($(key)); toast('자동 복사가 막혀 있어요. 선택된 값을 직접 복사하세요'); }
});

/* 화면 스포이드는 브라우저가 지원하고 이 환경에서 허용될 때만 동작해요 */
if ('EyeDropper' in window) {
  $('screenBtn').hidden = false;
  $('screenBtn').onclick = async () => {
    try {
      const res = await new EyeDropper().open();
      const n = parseInt(res.sRGBHex.slice(1), 16);
      setColor(n >> 16, (n >> 8) & 255, n & 255, true);
    } catch (err) { /* 취소하거나 사용할 수 없는 경우 */ }
  };
}

drawSample();
setColor(31, 111, 235, false);
</script>

</body>
</html>
